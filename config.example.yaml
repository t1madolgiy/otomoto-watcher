# Otomoto Watcher — пример конфигурации
# Скопируйте этот файл в config.yaml и заполните своими значениями.
# При запуске через GitHub Actions значения берутся из переменных окружения (см. README).

# URL поиска на Otomoto. Откройте https://www.otomoto.pl/, настройте фильтры
# (марка, модель, цена, город и т.д.) и скопируйте URL из адресной строки.
# Можно указать несколько URL — все они будут проверяться.
search_urls:
  - "https://www.otomoto.pl/osobowe/bmw/od-2015?search%5Bfilter_float_price%3Ato%5D=50000"
  # - "https://www.otomoto.pl/osobowe/audi/a4"

# Telegram bot
telegram:
  bot_token: "123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11"
  chat_id: "123456789"

# Сколько объявлений максимум проверять за один прогон
# (Otomoto показывает 32 объявления на странице, обычно этого достаточно)
max_listings_per_run: 32

# Игнорировать объявления старше N часов (если уведомитель долго не работал,
# не присылать тонну старых объявлений). 0 = не ограничивать.
max_age_hours: 24

# При первом запуске НЕ присылать все существующие объявления —
# просто запомнить их как "уже виденные". Включите для первого запуска!
seed_only: false
